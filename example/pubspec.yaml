name: login_with_connect_example
description: Example app for login_with_connect (Connect Persona sign-in).
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.8.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  # Bundled with the package so we use a path dependency on the parent.
  # Real apps should use a version constraint instead.
  login_with_connect:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
